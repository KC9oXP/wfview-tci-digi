name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  # Publishing a release builds its tag again and attaches the AppImage to it.
  release:
    types: [ published ]
  # Run by hand on a v* tag (Actions > Build > Run workflow > pick the tag) to attach it again.
  workflow_dispatch:

env:
  QT_VERSION: '6.8.1'

jobs:
  linux:
    # Ubuntu 22.04 (glibc 2.35) so the AppImage also runs on older distributions.
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # attach the AppImage to the release of a v* tag
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtwebsockets
          cache: true
      - name: Qt-free unit tests
        run: |
          g++ -std=c++17 -O2 -Wall -Isrc -Iengine tests/test_protocol.cpp src/tciprotocol.cpp engine/rttycore.cpp engine/rttytxsource.cpp -o test_protocol
          ./test_protocol
          g++ -std=c++17 -O2 -Isrc -Iengine -Iengine/ggmorse/include tests/test_cw.cpp src/tciprotocol.cpp engine/ggmorse/src/ggmorse.cpp engine/ggmorse/src/resampler.cpp -o test_cw
          ./test_cw
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_psk.cpp engine/pskcore.cpp -o test_psk
          ./test_psk
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_hell.cpp engine/hellcore.cpp -o test_hell
          ./test_hell
          g++ -std=c++17 -O2 -Isrc -Iengine -Iengine/ggmorse/include tests/test_cwtx.cpp engine/cwtxcore.cpp engine/modemtxsource.cpp engine/pskcore.cpp engine/hellcore.cpp engine/ggmorse/src/ggmorse.cpp engine/ggmorse/src/resampler.cpp -o test_cwtx
          ./test_cwtx
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_sstv.cpp engine/sstvcore.cpp -o test_sstv
          ./test_sstv
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_wefax.cpp engine/wefaxcore.cpp -o test_wefax
          ./test_wefax
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_navtex.cpp engine/navtexcore.cpp -o test_navtex
          ./test_navtex
          g++ -std=c++17 -O2 -Iengine tests/test_olivia.cpp engine/oliviacore.cpp -o test_olivia
          ./test_olivia
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_wwv.cpp engine/wwvcore.cpp -o test_wwv
          ./test_wwv
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_version.cpp -o test_version
          ./test_version
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_txlevel.cpp -o test_txlevel
          ./test_txlevel
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_autolevel.cpp -o test_autolevel
          ./test_autolevel
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_freqdigits.cpp -o test_freqdigits
          ./test_freqdigits
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_memories.cpp -o test_memories
          ./test_memories resources/memories-builtin.csv
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_pskreporter.cpp -o test_pskreporter
          ./test_pskreporter
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_gridtracker.cpp -o test_gridtracker
          ./test_gridtracker
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_inputlevel.cpp -o test_inputlevel
          ./test_inputlevel
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_stanagegg.cpp engine/rttycore.cpp -o test_stanagegg
          ./test_stanagegg
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_upload.cpp -o test_upload
          ./test_upload
          g++ -std=c++17 -O2 -Wall -Iengine tests/test_lookup.cpp -o test_lookup
          ./test_lookup
      - name: Build app
        run: |
          mkdir build && cd build
          qmake ../wfview-tci-digi.pro CONFIG+=release
          make -j4
      - name: End-to-end test against the mock wfview TCI server
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir build-tests && cd build-tests
          qmake ../tests/test_e2e.pro CONFIG+=release
          make -j4
          g++ -std=c++17 -O2 ../tests/fake_tqsl.cpp -o fake_tqsl
          mkdir -p ../screens
          ./test_e2e --screens ../screens
      - uses: actions/upload-artifact@v4
        with:
          name: screens-linux
          path: screens/*.png
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'   # no FUSE on the runner
          NO_STRIP: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 file
          ver=$(sed -n 's/^VERSION = //p' wfview-tci-digi.pro | tr -d '[:space:]')
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage
          export QMAKE=$(command -v qmake)
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH"
          export LINUXDEPLOY_OUTPUT_VERSION="$ver"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/wfview-tci-digi \
            --desktop-file dist/linux/wfview-tci-digi.desktop \
            --icon-file icons/wfview-tci-digi.png \
            --plugin qt --output appimage
          out="wfview-tci-digi-$ver-x86_64.AppImage"
          for f in ./*-x86_64.AppImage; do
            case "$f" in ./linuxdeploy*|"./$out") ;; *) mv "$f" "$out" ;; esac
          done
          ls -l "$out"
          # Checks: nothing missing in the bundled app and the X11 platform plugin, and the app starts.
          if ldd AppDir/usr/bin/wfview-tci-digi AppDir/usr/plugins/platforms/libqxcb.so | grep "not found"; then
            echo "missing libraries in the AppImage"; exit 1
          fi
          QT_QPA_PLATFORM=offscreen timeout 30 ./"$out" --version
          echo "APPIMAGE=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: wfview-tci-digi-linux-x86_64
          path: ${{ env.APPIMAGE }}
      - name: Attach the AppImage to the release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release upload "$tag" "$APPIMAGE" --clobber -R "$GITHUB_REPOSITORY"

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtwebsockets
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build app
        shell: cmd
        run: |
          mkdir build && cd build
          qmake ..\wfview-tci-digi.pro CONFIG+=release
          nmake
      - name: End-to-end test against the mock wfview TCI server
        shell: cmd
        run: |
          mkdir build-tests && cd build-tests
          qmake ..\tests\test_e2e.pro CONFIG+=release
          nmake
          cl /nologo /EHsc ..\tests\fake_tqsl.cpp /Fe:fake_tqsl.exe
          windeployqt --release --no-translations release\test_e2e.exe
          release\test_e2e.exe
      - name: Package
        shell: pwsh
        run: |
          $ver = (Select-String -Path wfview-tci-digi.pro -Pattern '^VERSION = (.+)$').Matches[0].Groups[1].Value.Trim()
          $out = "wfview-tci-digi-$ver-win64"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item build\release\wfview-tci-digi.exe $out\
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw "$out\wfview-tci-digi.exe"
          Copy-Item README.md, LICENSE $out\
          Compress-Archive -Path "$out\*" -DestinationPath "$out.zip"
          "ZIP=$out.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: wfview-tci-digi-win64
          path: ${{ env.ZIP }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets
          cache: true
      - name: Build app
        run: |
          mkdir build && cd build
          qmake ../wfview-tci-digi.pro CONFIG+=release
          make -j4
